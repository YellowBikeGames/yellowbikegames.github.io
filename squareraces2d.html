<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#079b67">
  <meta name="description" content="Square Races 2D - A chaotic 2D square racing game by YellowBike Games.">
  <title>Square Races 2D</title>

  <!-- Automatic redirect fallback -->
  <meta http-equiv="refresh" content="2;url=https://play.google.com/store/apps/details?id=com.yellowbikegames.squareraces2d">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #087f9f;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: white;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.20), transparent 28%),
        radial-gradient(circle at 80% 80%, rgba(0,0,0,.18), transparent 30%),
        linear-gradient(135deg, #159dc2 0%, #087eaa 48%, #075e91 100%);
    }

    .speed-lines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      opacity: .28;
    }

    .speed-lines span {
      position: absolute;
      height: 4px;
      border-radius: 999px;
      background: white;
      transform: rotate(-24deg);
    }

    .speed-lines span:nth-child(1) { width: 260px; top: 12%; left: -40px; }
    .speed-lines span:nth-child(2) { width: 150px; top: 27%; right: -20px; }
    .speed-lines span:nth-child(3) { width: 330px; top: 74%; left: -100px; }
    .speed-lines span:nth-child(4) { width: 190px; top: 86%; right: -50px; }
    .speed-lines span:nth-child(5) { width: 100px; top: 42%; left: 4%; }
    .speed-lines span:nth-child(6) { width: 120px; top: 58%; right: 5%; }

    .card {
      position: relative;
      width: min(92vw, 620px);
      padding: 42px 32px 34px;
      text-align: center;
      border-radius: 28px;
      background: rgba(255,255,255,.96);
      color: #202124;
      box-shadow: 0 25px 70px rgba(0,0,0,.30);
      animation: appear .55s ease-out;
    }

    .logo {
      width: min(100%, 460px);
      border-radius: 18px;
      display: block;
      margin: 0 auto 25px;
      box-shadow: 0 12px 30px rgba(0,0,0,.22);
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 7vw, 52px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -2px;
    }

    .developer {
      margin-top: 10px;
      color: #079b67;
      font-weight: 700;
      font-size: 17px;
    }

    .message {
      margin: 20px auto 25px;
      max-width: 440px;
      color: #5f6368;
      font-size: 16px;
      line-height: 1.5;
    }

    .play-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 245px;
      padding: 15px 24px;
      border-radius: 12px;
      background: #079b67;
      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: 800;
      box-shadow: 0 7px 0 #057a52;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .play-button:hover {
      transform: translateY(2px);
      box-shadow: 0 5px 0 #057a52;
    }

    .play-icon {
      width: 0;
      height: 0;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      border-left: 13px solid white;
    }

    .redirect {
      margin-top: 23px;
      font-size: 13px;
      color: #777;
    }

    .loader {
      width: 180px;
      height: 4px;
      margin: 10px auto 0;
      overflow: hidden;
      border-radius: 10px;
      background: #e4e4e4;
    }

    .loader::after {
      content: "";
      display: block;
      width: 45%;
      height: 100%;
      border-radius: inherit;
      background: #079b67;
      animation: loading 2s linear forwards;
    }

    @keyframes loading {
      from { transform: translateX(-100%); }
      to { transform: translateX(420%); }
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(18px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 500px) {
      .card {
        padding: 25px 18px 25px;
        border-radius: 22px;
      }

      .logo {
        border-radius: 14px;
        margin-bottom: 20px;
      }
    }
  </style>
</head>
